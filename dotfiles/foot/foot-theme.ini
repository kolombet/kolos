# foot's actual built-in defaults, vendored here so this config is
# self-contained. Previously this file did
# `include=/usr/share/sway/templates/foot.ini`, a path that only exists via
# Manjaro's manjaro-sway-theme package — silently broken on vanilla Arch.
# See docs/user-stories.md, "Portable, self-contained restore".

[main]
# Plain "monospace" alias, chosen over the Nerd Font "Mono" variant despite
# the tradeoff: icon/powerline glyphs from the regular face can span more
# than one cell, misaligning the grid for box-drawing/wide glyphs. See
# CLAUDE.md "Status bar" for the "Mono" reasoning applied to kolos-bar,
# where that tradeoff wasn't accepted.
font=monospace:size=14

[colors-dark]
foreground=ffffff
background=242424

regular0=242424
regular1=f62b5a
regular2=47b413
regular3=e3c401
regular4=24acd4
regular5=f2affd
regular6=13c299
regular7=e6e6e6

bright0=616161
bright1=ff4d51
bright2=35d450
bright3=e9e836
bright4=5dc5f8
bright5=feabf2
bright6=24dfc4
bright7=ffffff
