[package]
name = "kolos-launcher"
version = "0.7.6"
authors = ["Folke Gleumes <folke-kickoff@gleumes.org>", "Kirill Kolombet"]
edition = "2024"
description = "kolos app launcher: a fork of kickoff with a gamepad mode"
license = "GPL-3.0-or-later"
readme = "README.md"
rust-version = "1.85"

[dependencies]
smithay-client-toolkit = "0.20"
fontdue = "0.9"
image = { version = "0.25", default-features = false }
fuzzy-matcher = "0.3"
nix = { version = "0.31", default-features = false, features = ["process"] }
css-color = "0.2"
exec = "0.3"
xdg = "3.0"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
fontconfig = "0.10"
notify-rust = "4.16"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
futures = "0.3"
wayland-client = "0.31"
anyhow = "1.0"
libc = "0.2"
wl-clipboard-rs = "0.9"
x11-keysymdef = "0.2"

[dependencies.tokio]
version = "1.52"
features = [
    "fs",
    "rt-multi-thread",
    "io-util",
    "time",
    "rt",
    "macros",
    "io-std",
]
default-features = false

[profile.release]
lto = true
