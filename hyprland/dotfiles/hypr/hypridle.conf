# hypridle — screen dim/off and auto-suspend on idle
# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#
# No screen locker (hyprlock, swaylock, ...) is installed in this setup, so
# lock_cmd/before_sleep_cmd are left commented out — dpms off and suspend
# don't need one. If you add a locker later, uncomment them.

general {
    # lock_cmd = hyprlock
    # before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                          # 5 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600                    # 10 min
    on-timeout = systemctl suspend
}
