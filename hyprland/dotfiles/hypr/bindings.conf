# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal --working-directory="$(~/.config/hypr/terminal-cwd.sh)"
bind = $mainMod, B, exec, $browser
bind = $mainMod, E, exec, $editor
bind = $mainMod, Z, exec, zed
bind = $mainMod, N, exec, nvim
bind = $mainMod, Q, killactive
# bind = $mainMod, F, exec, $fm
bind = $mainMod, F, exec, ~/.config/hypr/float.sh
bind = $mainMod, T, exec, ~/.config/hypr/tile.sh
bind = $mainMod, Y, exec, foot yazi
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, W, togglesplit, # dwindle
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, alterzorder, top
bind = $mainMod SHIFT, Tab, cyclenext, prev
bind = $mainMod SHIFT, Tab, alterzorder, top
bind = $mainMod, grave, exec, pkill -12 nwg-wrapper  # toggle cheatsheet

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Raise the newly-focused floating window to the top of the stack — movefocus
# and cyclenext don't restack on their own (unlike a mouse click, which
# raises automatically)
bind = $mainMod, H, alterzorder, top
bind = $mainMod, L, alterzorder, top
bind = $mainMod, K, alterzorder, top
bind = $mainMod, J, alterzorder, top

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll (disabled)
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, R, submap, resize

submap = resize
bind = , H, exec, hyprctl dispatch resizeactive -50 0
bind = , L, exec, hyprctl dispatch resizeactive 50 0
bind = , K, exec, hyprctl dispatch resizeactive 0 -50
bind = , J, exec, hyprctl dispatch resizeactive 0 50
bind = , Return, submap, reset
bind = , Escape, submap, reset
#bind = h, exec, hyprctl dispatch resizeactive -10 0
#bind = l, exec, hyprctl dispatch resizeactive 10 0
#bind = k, exec, hyprctl dispatch resizeactive 0 -10
#bind = j, exec, hyprctl dispatch resizeactive 0 10
#bind = escape, submap, reset
#bind = return, submap, reset
submap = reset

bind = $mainMod, M, submap, move

submap = move
bind = , H, exec, hyprctl dispatch moveactive -50 0
bind = , L, exec, hyprctl dispatch moveactive 50 0
bind = , K, exec, hyprctl dispatch moveactive 0 -50
bind = , J, exec, hyprctl dispatch moveactive 0 50
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
