# Portal backends for XDG_CURRENT_DESKTOP=Hyprland. Only the file chooser is
# routed, to xdg-desktop-portal-cosmic (iced, no GTK/Qt): it's what Brave
# uses for open/save dialogs when GTK isn't installed. xdg-desktop-portal-gtk
# is gone with GTK, and xdg-desktop-portal-hyprland needs Qt6 (No Qt, no GTK rule,
# see CLAUDE.md), so there's no screen-sharing portal.
[preferred]
default=none
org.freedesktop.impl.portal.FileChooser=cosmic
